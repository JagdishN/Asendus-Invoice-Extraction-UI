<div class="login-page">
  <div class="login-main">
    <div class="login-shell">
      <div class="login-brand">
        <span class="login-brand__welcome">Welcome to</span>

        <img class="login-brand__logo" src="/company-logo.jpeg" alt="Company logo" />

        <h1 class="login-brand__title">Invoice Extraction</h1>
        <p class="login-brand__tagline">Extract invoice data quickly and accurately</p>

        <div class="login-brand__flow">
          <span>Upload</span>
          <span class="login-brand__flow-arrow" aria-hidden="true">&rarr;</span>
          <span>Extract</span>
          <span class="login-brand__flow-arrow" aria-hidden="true">&rarr;</span>
          <span>Review</span>
          <span class="login-brand__flow-arrow" aria-hidden="true">&rarr;</span>
          <span>Export</span>
        </div>

        <span class="login-brand__client">For Jyothi Medical Hall</span>
      </div>

      <div class="login-card">
        <h2 class="login-card__title">Welcome Back</h2>
        <p class="login-card__subtitle">Sign in to Invoice Extraction</p>

        <div class="login-account">
          <span class="login-account__role">{{ accountDisplayName }}</span>
          <span class="login-account__divider" aria-hidden="true">&middot;</span>
          <span class="login-account__username">{{ accountUsername }}</span>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" class="login-form" novalidate>
          <label class="field">
            <span class="field__label">Password</span>
            <div class="field__input-wrap">
              <input
                [type]="passwordVisible() ? 'text' : 'password'"
                formControlName="password"
                autocomplete="current-password"
                placeholder="Enter password"
              />
              <button
                type="button"
                class="field__toggle-visibility"
                [attr.aria-pressed]="passwordVisible()"
                [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
                (click)="togglePasswordVisibility()"
              >
                @if (passwordVisible()) {
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.6 18.6 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 8 11 8a18.6 18.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                    <line x1="1" y1="1" x2="23" y2="23" />
                  </svg>
                } @else {
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                }
              </button>
            </div>
            @if (form.controls.password.invalid && form.controls.password.touched) {
              <span class="field__error">Password must be at least 6 characters.</span>
            }
          </label>

          <button type="submit" class="submit-btn" [disabled]="form.invalid || submitting()">
            {{ submitting() ? 'Signing in…' : 'Sign In' }}
          </button>
        </form>
      </div>
    </div>
  </div>

  <p class="login-footer">&copy; 2026 Asendus Innovations LLP</p>
</div>
